<svg xmlns="http://www.w3.org/2000/svg" width="958" height="276" viewBox="0 0 958 276" role="img" aria-label="Sentinel Greenhorn - when it goes wrong" font-family="Cascadia Mono, Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="16" xml:space="preserve">
