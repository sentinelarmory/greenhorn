<text x="22" y="106" textLength="432.0" lengthAdjust="spacingAndGlyphs" fill="#ff5f5f" clip-path="url(#ooc2)">  Yikes, an error! But only a teeny tiny one.</text><clipPath id="ooc3"><rect x="22" y="114" width="0" height="24">
  <set attributeName="width" to="0" begin="ooloop.begin"/>
