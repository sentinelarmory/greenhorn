<text x="22" y="130" textLength="595.2" lengthAdjust="spacingAndGlyphs" fill="#808080" clip-path="url(#ooc3)">     (What happened: Back up the old .wslconfig went belly up)</text><clipPath id="ooc4"><rect x="22" y="138" width="0" height="24">
  <set attributeName="width" to="0" begin="ooloop.begin"/>
