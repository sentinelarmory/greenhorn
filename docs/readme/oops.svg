</rect></clipPath>
<text x="22" y="154" textLength="768.0" lengthAdjust="spacingAndGlyphs" fill="#ffafff" clip-path="url(#ooc4)">  Relax! Even the best of us hear "no" now and then. Sentinel has got your back!</text><clipPath id="ooc5"><rect x="22" y="162" width="0" height="24">
  <set attributeName="width" to="0" begin="ooloop.begin"/>
  <animate attributeName="width" values="0.0;21.8;43.7;65.5;87.4;109.2;131.0;152.9;174.7;196.6;218.4;240.2;262.1;283.9;305.8;327.6;349.4;371.3;393.1;415.0;436.8;458.6;480.5;502.3;524.2;546.0;567.8;589.7;611.5;633.4;655.2;677.0;698.9;720.7;742.6;764.4;786.2;808.1;829.9;851.8;873.6" calcMode="discrete" dur="1.82s" begin="ooloop.begin+5.73s" fill="freeze"/>
</rect></clipPath>
<text x="22" y="178" textLength="873.6" lengthAdjust="spacingAndGlyphs" fill="#ffffaf" clip-path="url(#ooc5)">  Do this and we're back on track: take a screenshot (Win+Shift+S) and send it to Sentinel.</text><clipPath id="ooc7"><rect x="22" y="210" width="0" height="24">
  <set attributeName="width" to="0" begin="ooloop.begin"/>
  <animate attributeName="width" values="0.0;17.5;35.0;52.6;70.1;87.6;105.1;122.6;140.2;157.7;175.2;192.7;210.2;227.8;245.3;262.8;280.3;297.8;315.4;332.9;350.4;367.9;385.4;403.0;420.5;438.0;455.5;473.0;490.6;508.1;525.6;543.1;560.6;578.2;595.7;613.2;630.7;648.2;665.8;683.3;700.8" calcMode="discrete" dur="1.46s" begin="ooloop.begin+7.82s" fill="freeze"/>
</rect></clipPath>
<text x="22" y="226" textLength="700.8" lengthAdjust="spacingAndGlyphs" fill="#ffff00" clip-path="url(#ooc7)" filter="url(#ooglow)">  *** Look at you go! You'll be fixing other people's computers next! ***</text>
<rect y="34" width="958" height="242" fill="url(#ooscan)"/>
