<text x="22" y="58" textLength="364.8" lengthAdjust="spacingAndGlyphs" fill="#ffaf00" clip-path="url(#ooc0)">  [DRY-RUN] Back up the old .wslconfig</text><clipPath id="ooc2"><rect x="22" y="90" width="0" height="24">
  <set attributeName="width" to="0" begin="ooloop.begin"/>
  <animate attributeName="width" values="0.0;10.8;21.6;32.4;43.2;54.0;64.8;75.6;86.4;97.2;108.0;118.8;129.6;140.4;151.2;162.0;172.8;183.6;194.4;205.2;216.0;226.8;237.6;248.4;259.2;270.0;280.8;291.6;302.4;313.2;324.0;334.8;345.6;356.4;367.2;378.0;388.8;399.6;410.4;421.2;432.0" calcMode="discrete" dur="0.90s" begin="ooloop.begin+1.63s" fill="freeze"/>
